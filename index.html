<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тренер по плаванию | Кирилл Онипко</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-2 sm:p-6 pb-12">

  <div class="w-full max-w-md bg-slate-950 rounded-3xl shadow-2xl overflow-hidden border border-slate-800 flex flex-col min-h-[720px] relative">
    
    <!-- Шапка профиля -->
    <header class="bg-gradient-to-r from-blue-900 via-blue-800 to-red-700 text-white p-5 relative border-b border-red-500/30">
      <div class="flex justify-between items-start">
        <div>
          <span class="inline-block bg-red-600 text-white text-[10px] px-2.5 py-0.5 rounded-full uppercase tracking-wider font-extrabold mb-1 shadow-sm">
            ONIPKO TEAM
          </span>
          <h1 class="text-2xl font-black tracking-tight leading-tight">Кирилл Онипко</h1>
          <p class="text-blue-200 text-xs font-medium">Персональный тренер по плаванию</p>
        </div>
        <button onclick="toggleAdminAuth()" class="bg-black/30 hover:bg-red-600/80 p-2.5 rounded-full transition text-white border border-white/10" title="Тренер">
          <i class="fa-solid fa-lock text-xs"></i>
        </button>
      </div>

      <div class="mt-3 pt-3 border-t border-white/10 flex gap-2">
        <a href="https://vk.ru/club239758541" target="_blank" class="flex-1 bg-blue-950/60 hover:bg-blue-800/80 py-1.5 px-3 rounded-xl flex items-center justify-center gap-2 text-xs font-semibold border border-blue-400/20 transition">
          <i class="fa-brands fa-vk text-sm text-blue-400"></i> VK
        </a>
        <a href="https://t.me/kkkkk_ooooo" target="_blank" class="flex-1 bg-red-950/60 hover:bg-red-800/80 py-1.5 px-3 rounded-xl flex items-center justify-center gap-2 text-xs font-semibold border border-red-400/20 transition">
          <i class="fa-brands fa-telegram text-sm text-red-400"></i> Telegram
        </a>
      </div>
    </header>

    <!-- Вкладки навигации -->
    <nav id="clientTabs" class="flex border-b border-slate-800 bg-slate-900/90 text-xs font-bold text-slate-400">
      <button onclick="switchTab('booking')" id="tabBooking" class="flex-1 py-3 text-center border-b-2 border-red-600 text-red-500 transition flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-person-swimming"></i> Кабинет и запись
      </button>
      <button onclick="switchTab('shop')" id="tabShop" class="flex-1 py-3 text-center border-b-2 border-transparent hover:text-slate-200 transition flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-bag-shopping"></i> Экипировка
      </button>
    </nav>

    <!-- Статус подключения -->
    <div id="loadingStatus" class="p-1.5 bg-blue-950/80 text-blue-300 text-[10px] font-semibold text-center flex items-center justify-center gap-2 border-b border-blue-900/40">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span id="statusText">База данных готова к работе</span>
    </div>

    <!-- Основной экран -->
    <main class="p-4 flex-1 flex flex-col justify-between" id="appContent">
      <div class="my-auto py-8 text-center">
        <div class="w-16 h-16 bg-blue-900/40 border border-blue-500/30 text-blue-400 rounded-3xl flex items-center justify-center mx-auto mb-3 text-3xl shadow-lg">
          <i class="fa-solid fa-person-swimming"></i>
        </div>
        <h2 class="text-xl font-black text-white">Кабинет пловца</h2>
        <p class="text-slate-400 text-xs mt-1 mb-5">Введите ваш персональный код доступа</p>
        <input id="clientCodeInput" type="text" placeholder="Например: 001" class="w-full text-center text-xl tracking-widest px-4 py-3.5 bg-slate-900 border border-slate-700 rounded-2xl font-black text-white mb-3 focus:border-red-500 focus:outline-none" />
        <button onclick="loginClient()" class="w-full bg-gradient-to-r from-blue-700 to-red-600 hover:from-blue-600 hover:to-red-500 text-white font-bold py-3.5 rounded-2xl shadow-lg transition">
          Войти в профиль
        </button>
      </div>
    </main>

    <!-- Модалка самостоятельного наплава -->
    <div id="distanceModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
      <div class="bg-slate-900 border border-slate-700 w-full max-w-sm rounded-3xl p-5 relative">
        <button onclick="closeDistanceModal()" class="absolute top-4 right-4 w-8 h-8 bg-slate-800 text-slate-400 rounded-full flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <h3 class="text-sm font-bold text-white mb-2">Внести самостоятельный заплыв</h3>
        <p class="text-[11px] text-slate-400 mb-3">Метры добавятся в ваш общий маршрут из Центра Владивостока</p>
        <input id="manualMetersInput" type="number" placeholder="Например: 1200 м" class="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-white font-bold text-center mb-3 focus:outline-none focus:border-red-500" />
        <button onclick="addManualDistance()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl transition text-xs shadow-lg">
          Сохранить дистанцию
        </button>
      </div>
    </div>

  </div>

  <script>
    const ADMIN_PIN = "1234";
    const TG_USERNAME = "kkkkk_ooooo";

    // Возможные адреса вашей базы данных Firebase
    const DB_ENDPOINTS = [
      "https://onipko-coach-default-rtdb.europe-west1.firebasedatabase.app/app_data.json",
      "https://onipko-coach-default-rtdb.firebaseio.com/app_data.json"
    ];
    let workingEndpoint = DB_ENDPOINTS[0];

    // Маршруты от Центра Владивостока
    const VLADIVOSTOK_ROUTES = [
      { name: "СК «Чемпион» (ВВГУ / Гоголя)", km: 3.5 },
      { name: "Вторая Речка (Автовокзал)", km: 8.0 },
      { name: "СК «Чемпион» / фабрика «Заря»", km: 13.0 },
      { name: "Океанариум (о. Русский)", km: 18.0 },
      { name: "Седанка / Садгород", km: 25.0 },
      { name: "Бухта Шамора (Лазурная)", km: 35.0 },
      { name: "г. Артём (Центр)", km: 45.0 },
      { name: "Международный аэропорт Кневичи (VVO)", km: 55.0 },
      { name: "г. Уссурийск", km: 100.0 },
      { name: "г. Находка", km: 175.0 }
    ];

    const defaultData = {
      clients: [
        { id: "001", name: "Ученик", balance: 8, meters: 0 }
      ],
      slots: [],
      categories: ["Очки", "Шапочки", "Инвентарь"],
      products: [
        {
          id: 101,
          category: "Очки",
          title: "Mad Wave Alien",
          price: 3490,
          desc: "Стартово-тренировочные очки с зеркальным напылением и идеальной гидродинамикой.",
          image: "https://images.unsplash.com/photo-1519315901367-f34ff9154487?auto=format&fit=crop&w=400&q=80"
        }
      ]
    };

    // Загрузка локальных данных
    let savedLocal = null;
    try {
      savedLocal = JSON.parse(localStorage.getItem('onipko_data'));
    } catch(e) {}

    let state = {
      data: savedLocal || defaultData,
      currentView: 'client_login',
      currentTab: 'booking',
      currentClientId: null,
      slotFilterPeriod: 'all',
      checklist: { glasses: false, cap: false, suit: false, towel: false }
    };

    // Списание тренировок после наступления даты и времени
    function processCompletedSessions() {
      if (!state.data.slots || !state.data.slots.length) return false;
      const now = new Date();
      let hasChanges = false;

      state.data.slots.forEach(slot => {
        if (slot.bookedBy && !slot.completed && slot.date && slot.time) {
          const [hours, minutes] = slot.time.split(':').map(Number);
          const [year, month, day] = slot.date.split('-').map(Number);
          const sessionEnd = new Date(year, month - 1, day, hours, minutes);

          if (now >= sessionEnd) {
            slot.completed = true;
            const client = state.data.clients.find(c => c.id === slot.bookedBy);
            if (client) {
              client.balance = Math.max(0, (client.balance || 0) - 1);
            }
            hasChanges = true;
          }
        }
      });

      return hasChanges;
    }

    // Сохранение данных на сервер без зависаний
    async function saveToServer() {
      try {
        localStorage.setItem('onipko_data', JSON.stringify(state.data));
        await fetch(workingEndpoint, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(state.data)
        });
      } catch (e) {
        console.warn("Данные сохранены локально", e);
      }
    }

    // Загрузка данных с автоматическим выбором сервера
    async function fetchServerData() {
      for (const endpoint of DB_ENDPOINTS) {
        try {
          const res = await fetch(endpoint, { cache: 'no-store' });
          if (res.ok) {
            workingEndpoint = endpoint;
            const val = await res.json();
            if (val) {
              state.data = val;
              if (!state.data.clients) state.data.clients = [];
              if (!state.data.slots) state.data.slots = [];
              if (!state.data.products) state.data.products = [];
              localStorage.setItem('onipko_data', JSON.stringify(state.data));
            } else {
              saveToServer();
            }
            if (processCompletedSessions()) {
              saveToServer();
            }
            const st = document.getElementById('statusText');
            if (st) st.textContent = "Синхронизировано онлайн";
            render();
            return;
          }
        } catch (e) {
          // Пробуем следующий endpoint
        }
      }
      const st = document.getElementById('statusText');
      if (st) st.textContent = "Автономный режим (сохранено на телефоне)";
    }

    // Первичная загрузка и автообновление каждые 10 секунд
    fetchServerData();
    setInterval(fetchServerData, 10000);

    function switchTab(tab) {
      state.currentTab = tab;
      const tabBooking = document.getElementById('tabBooking');
      const tabShop = document.getElementById('tabShop');
      if (tab === 'booking') {
        tabBooking.className = "flex-1 py-3 text-center border-b-2 border-red-600 text-red-500 font-bold transition flex items-center justify-center gap-1.5";
        tabShop.className = "flex-1 py-3 text-center border-b-2 border-transparent text-slate-400 font-semibold hover:text-slate-200 transition flex items-center justify-center gap-1.5";
      } else {
        tabShop.className = "flex-1 py-3 text-center border-b-2 border-red-600 text-red-500 font-bold transition flex items-center justify-center gap-1.5";
        tabBooking.className = "flex-1 py-3 text-center border-b-2 border-transparent text-slate-400 font-semibold hover:text-slate-200 transition flex items-center justify-center gap-1.5";
      }
      render();
    }

    function calculateRouteProgress(totalMeters) {
      const totalKm = (totalMeters || 0) / 1000;
      let reached = "Центральная площадь";
      let next = VLADIVOSTOK_ROUTES[0];
      let prevKm = 0;

      for (let i = 0; i < VLADIVOSTOK_ROUTES.length; i++) {
        if (totalKm >= VLADIVOSTOK_ROUTES[i].km) {
          reached = VLADIVOSTOK_ROUTES[i].name;
          prevKm = VLADIVOSTOK_ROUTES[i].km;
          next = VLADIVOSTOK_ROUTES[i + 1] || null;
        } else {
          next = VLADIVOSTOK_ROUTES[i];
          break;
        }
      }

      let percent = 100;
      let toNextKm = 0;
      if (next) {
        const span = next.km - prevKm;
        const progressInSpan = totalKm - prevKm;
        percent = Math.min(100, Math.max(0, Math.round((progressInSpan / span) * 100)));
        toNextKm = (next.km - totalKm).toFixed(1);
      }

      return { totalKm: totalKm.toFixed(1), reached, next, percent, toNextKm };
    }

    function toggleCheck(item) {
      state.checklist[item] = !state.checklist[item];
      render();
    }

    function openDistanceModal() {
      document.getElementById('distanceModal').classList.remove('hidden');
    }
    function closeDistanceModal() {
      document.getElementById('distanceModal').classList.add('hidden');
    }

    function addManualDistance() {
      const val = parseInt(document.getElementById('manualMetersInput').value);
      if (!val || val <= 0) return alert("Введите число метров!");

      const client = state.data.clients.find(c => c.id === state.currentClientId);
      if (client) {
        client.meters = (client.meters || 0) + val;
        saveToServer();
        closeDistanceModal();
        render();
        alert(`+${val} м добавлено к вашему маршруту!`);
      }
    }

    function generateDaySlots() {
      const dateInput = document.getElementById('adminBatchDate').value;
      if (!dateInput) return alert("Выберите дату!");

      const daysOfWeek = ["Воскресенье", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];
      const dateObj = new Date(dateInput);
      const dayName = daysOfWeek[dateObj.getDay()];

      if (dayName === "Воскресенье") {
        return alert("Воскресенье — выходной. Выберите день с Пн по Сб.");
      }

      for (let h = 7; h <= 23; h++) {
        const timeStr = (h < 10 ? '0' : '') + h + ':00';
        const exists = state.data.slots.some(s => s.date === dateInput && s.time === timeStr);
        if (!exists) {
          state.data.slots.push({
            id: Date.now() + Math.random(),
            date: dateInput,
            day: dayName,
            time: timeStr,
            bookedBy: null,
            completed: false
          });
        }
      }

      saveToServer();
      render();
      alert(`Сетка 07:00–23:00 на ${dayName} (${dateInput}) создана!`);
    }

    function assignClientToSlot(slotId, clientId) {
      const slot = state.data.slots.find(s => s.id === slotId);
      if (!slot) return;
      slot.bookedBy = clientId || null;
      slot.completed = false;
      saveToServer();
      render();
    }

    function bookSlot(slotId) {
      const client = state.data.clients.find(c => c.id === state.currentClientId);
      if (client.balance <= 0) {
        return alert("У вас 0 доступных занятий. Продлите абонемент в Telegram.");
      }
      const slot = state.data.slots.find(s => s.id === slotId);
      slot.bookedBy = client.id;
      slot.completed = false;
      saveToServer();
      render();
      alert(`Запись оформлена на ${slot.date} в ${slot.time}! Списание произойдёт после тренировки.`);
    }

    function cancelSlot(slotId) {
      const slot = state.data.slots.find(s => s.id === slotId);
      if (!slot) return;
      slot.bookedBy = null;
      slot.completed = false;
      saveToServer();
      render();
    }

    function addToCalendar(dateStr, timeStr) {
      const [year, month, day] = dateStr.split('-');
      const [hours, minutes] = timeStr.split(':');
      const start = new Date(year, month - 1, day, hours, minutes);
      const end = new Date(start.getTime() + 60 * 60 * 1000);
      const formatTime = (d) => d.toISOString().replace(/-|:|\.\d\d\d/g, "");

      const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent("Плавание с Кириллом Онипко")}&dates=${formatTime(start)}/${formatTime(end)}&details=${encodeURIComponent("Тренировка в бассейне.")}`;
      window.open(url, '_blank');
    }

    function render() {
      const main = document.getElementById('appContent');
      if (!main) return;
      const nav = document.getElementById('clientTabs');

      if (nav) {
        if (state.currentView === 'admin') {
          nav.classList.add('hidden');
        } else {
          nav.classList.remove('hidden');
        }
      }

      // 1. Вход ученика
      if (state.currentView === 'client_login' && state.currentTab === 'booking') {
        main.innerHTML = `
          <div class="my-auto py-8 text-center">
            <div class="w-16 h-16 bg-blue-900/40 border border-blue-500/30 text-blue-400 rounded-3xl flex items-center justify-center mx-auto mb-3 text-3xl shadow-lg">
              <i class="fa-solid fa-person-swimming"></i>
            </div>
            <h2 class="text-xl font-black text-white">Кабинет пловца</h2>
            <p class="text-slate-400 text-xs mt-1 mb-5">Введите ваш персональный код доступа</p>
            <input id="clientCodeInput" type="text" placeholder="Например: 001" class="w-full text-center text-xl tracking-widest px-4 py-3.5 bg-slate-900 border border-slate-700 rounded-2xl font-black text-white mb-3 focus:border-red-500 focus:outline-none" />
            <button onclick="loginClient()" class="w-full bg-gradient-to-r from-blue-700 to-red-600 hover:from-blue-600 hover:to-red-500 text-white font-bold py-3.5 rounded-2xl shadow-lg transition">
              Войти в профиль
            </button>
          </div>
        `;
        return;
      }

      // 2. Личный кабинет ученика
      if (state.currentView === 'client_cabinet' && state.currentTab === 'booking') {
        const client = state.data.clients.find(c => c.id === state.currentClientId) || { name: "Ученик", balance: 0, meters: 0, id: state.currentClientId };
        const mySlots = state.data.slots.filter(s => s.bookedBy === client.id);
        const freeSlots = state.data.slots.filter(s => !s.bookedBy && !s.completed);
        const route = calculateRouteProgress(client.meters || 0);

        const filteredFreeSlots = freeSlots.filter(s => {
          const hour = parseInt(s.time.split(':')[0]);
          if (state.slotFilterPeriod === 'morning') return hour >= 7 && hour < 12;
          if (state.slotFilterPeriod === 'day') return hour >= 12 && hour < 17;
          if (state.slotFilterPeriod === 'evening') return hour >= 17 && hour <= 23;
          return true;
        });

        main.innerHTML = `
          <div class="space-y-4">
            
            <div class="bg-gradient-to-r from-slate-900 to-blue-950 p-4 rounded-2xl border border-blue-900/50 flex justify-between items-center shadow-md">
              <div>
                <span class="text-[10px] text-red-400 font-extrabold uppercase">Пловец</span>
                <h2 class="text-base font-black text-white leading-tight">${client.name}</h2>
                <p class="text-[11px] text-slate-400">Код: <b>${client.id}</b></p>
              </div>
              <div class="text-right">
                <span class="text-[10px] text-slate-400 font-semibold uppercase">Баланс</span>
                <p class="text-2xl font-black text-red-500 leading-none">${client.balance} <span class="text-xs font-normal text-slate-300">зан.</span></p>
                <span class="text-[9px] text-blue-300 block mt-1">*Списание после тренировки</span>
              </div>
            </div>

            <!-- Авто-маршрут из Центра Владивостока -->
            <div class="bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 p-4 rounded-2xl border border-blue-500/20 shadow-md">
              <div class="flex justify-between items-center mb-2">
                <div class="flex items-center gap-2">
                  <span class="w-6 h-6 rounded-lg bg-red-600/20 text-red-400 flex items-center justify-center text-xs">
                    <i class="fa-solid fa-car-side"></i>
                  </span>
                  <span class="text-xs font-extrabold text-white">Маршрут из Центра Владивостока</span>
                </div>
                <button onclick="openDistanceModal()" class="text-[10px] bg-red-600/30 hover:bg-red-600 text-red-300 hover:text-white px-2.5 py-1 rounded-lg font-bold border border-red-500/40 transition">
                  + Мой заплыв
                </button>
              </div>

              <div class="text-xs text-slate-300 mb-2">
                Вы проплыли: <b class="text-white text-sm">${route.totalKm} км</b> (${client.meters || 0} м).
                <p class="text-[11px] text-blue-300 mt-0.5">
                  <i class="fa-solid fa-location-dot text-red-500 mr-1"></i> Сейчас вы на отметке: <b>${route.reached}</b>
                </p>
              </div>

              ${route.next ? `
                <div class="space-y-1">
                  <div class="flex justify-between text-[10px] font-bold">
                    <span class="text-slate-400">След. цель: ${route.next.name}</span>
                    <span class="text-red-400">ещё ${route.toNextKm} км</span>
                  </div>
                  <div class="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden border border-slate-700">
                    <div class="bg-gradient-to-r from-blue-500 to-red-500 h-full rounded-full transition-all duration-500" style="width: ${route.percent}%"></div>
                  </div>
                </div>
              ` : `
                <p class="text-xs text-emerald-400 font-bold">🏆 Вы преодолели путь от Владивостока до самой Находки!</p>
              `}
            </div>

            <!-- Чек-лист экипировки -->
            <div class="bg-slate-900/90 p-3 rounded-2xl border border-slate-800">
              <span class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400 mb-2 block">
                <i class="fa-solid fa-clipboard-check text-blue-400 mr-1"></i> Чек-лист перед выходом в бассейн:
              </span>
              <div class="grid grid-cols-2 gap-2 text-xs">
                <button onclick="toggleCheck('glasses')" class="p-2 rounded-xl border text-left flex items-center justify-between transition ${state.checklist.glasses ? 'bg-red-950/40 border-red-500 text-white font-bold' : 'bg-slate-950 border-slate-800 text-slate-400'}">
                  <span>🥽 Очки</span>
                  <i class="fa-solid ${state.checklist.glasses ? 'fa-check text-red-500' : 'fa-circle text-slate-700 text-[10px]'}"></i>
                </button>
                <button onclick="toggleCheck('cap')" class="p-2 rounded-xl border text-left flex items-center justify-between transition ${state.checklist.cap ? 'bg-red-950/40 border-red-500 text-white font-bold' : 'bg-slate-950 border-slate-800 text-slate-400'}">
                  <span>🏊‍♂️ Шапочка</span>
                  <i class="fa-solid ${state.checklist.cap ? 'fa-check text-red-500' : 'fa-circle text-slate-700 text-[10px]'}"></i>
                </button>
                <button onclick="toggleCheck('suit')" class="p-2 rounded-xl border text-left flex items-center justify-between transition ${state.checklist.suit ? 'bg-red-950/40 border-red-500 text-white font-bold' : 'bg-slate-950 border-slate-800 text-slate-400'}">
                  <span>🩱 Плавки / купальник</span>
                  <i class="fa-solid ${state.checklist.suit ? 'fa-check text-red-500' : 'fa-circle text-slate-700 text-[10px]'}"></i>
                </button>
                <button onclick="toggleCheck('towel')" class="p-2 rounded-xl border text-left flex items-center justify-between transition ${state.checklist.towel ? 'bg-red-950/40 border-red-500 text-white font-bold' : 'bg-slate-950 border-slate-800 text-slate-400'}">
                  <span>🧼 Полотенце / гель</span>
                  <i class="fa-solid ${state.checklist.towel ? 'fa-check text-red-500' : 'fa-circle text-slate-700 text-[10px]'}"></i>
                </button>
              </div>
            </div>

            <!-- Активные тренировки -->
            <div>
              <span class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400 mb-1.5 block">Ваши тренировки:</span>
              ${mySlots.length === 0 ? '<p class="text-xs text-slate-500 bg-slate-900 p-3 rounded-xl border border-slate-800">Нет активных тренировок.</p>' : ''}
              <div class="space-y-1.5 max-h-40 overflow-y-auto">
                ${mySlots.map(s => `
                  <div class="flex justify-between items-center ${s.completed ? 'bg-slate-900 border-slate-800 opacity-60' : 'bg-blue-950/40 border-blue-500/40'} border p-2.5 rounded-xl text-xs">
                    <div>
                      <span class="font-bold text-white">${s.date \vert{}\vert{} s.day},${s.time}</span>
                      <p class="text-[10px] ${s.completed ? 'text-slate-400 font-semibold' : 'text-red-400 font-bold'}">
                        ${s.completed ? '✓ Проведено (списано)' : '● Запланировано (спишется после тренировки)'}
                      </p>
                    </div>
                    <div class="flex items-center gap-1.5">
                      ${!s.completed && s.date ? `
                        <button onclick="addToCalendar('${s.date}', '${s.time}')" class="bg-blue-900/60 hover:bg-blue-800 text-blue-200 border border-blue-400/30 px-2 py-1 rounded-lg text-[10px] font-bold">
                          <i class="fa-regular fa-bell text-red-400 mr-0.5"></i> -1ч
                        </button>
                      ` : ''}
                      ${!s.completed ? `<button onclick="cancelSlot(${s.id})" class="text-red-400 font-semibold hover:underline">Отменить</button>` : ''}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Свободные окна тренера -->
            <div>
              <div class="flex justify-between items-center mb-1.5">
                <span class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400">Свободные окна тренера</span>
                <div class="flex gap-1 text-[10px]">
                  <button onclick="state.slotFilterPeriod='all'; render()" class="px-2 py-0.5 rounded-md font-bold ${state.slotFilterPeriod==='all' ? 'bg-red-600 text-white' : 'bg-slate-900 text-slate-400'}">Все</button>
                  <button onclick="state.slotFilterPeriod='morning'; render()" class="px-2 py-0.5 rounded-md font-bold ${state.slotFilterPeriod==='morning' ? 'bg-red-600 text-white' : 'bg-slate-900 text-slate-400'}">Утро</button>
                  <button onclick="state.slotFilterPeriod='day'; render()" class="px-2 py-0.5 rounded-md font-bold ${state.slotFilterPeriod==='day' ? 'bg-red-600 text-white' : 'bg-slate-900 text-slate-400'}">День</button>
                  <button onclick="state.slotFilterPeriod='evening'; render()" class="px-2 py-0.5 rounded-md font-bold ${state.slotFilterPeriod==='evening' ? 'bg-red-600 text-white' : 'bg-slate-900 text-slate-400'}">Вечер</button>
                </div>
              </div>

              <div class="space-y-1.5 max-h-48 overflow-y-auto pr-1">
                ${filteredFreeSlots.length === 0 ? '<p class="text-xs text-slate-500 bg-slate-900 p-2.5 rounded-xl border border-slate-800">Нет свободных окон на этот период.</p>' : ''}
                ${filteredFreeSlots.map(s => `
                  <div class="flex justify-between items-center bg-slate-900 border border-slate-800 p-2.5 rounded-xl text-xs hover:border-blue-500 transition">
                    <div>
                      <span class="font-bold text-slate-200">${s.date ? s.date + ' (' + s.day + ')' : s.day}</span>
                      <span class="block text-red-500 font-black text-sm">${s.time}</span>
                    </div>
                    <button onclick="bookSlot(${s.id})" class="bg-blue-600 hover:bg-red-600 text-white px-3 py-1.5 rounded-xl font-bold transition shadow-sm">
                      Записаться
                    </button>
                  </div>
                `).join('')}
              </div>
            </div>

            <button onclick="logout()" class="w-full text-center text-xs text-slate-500 hover:text-red-400 py-1 font-semibold">
              Выйти из кабинета
            </button>

          </div>
        `;
        return;
      }

      // 3. Панель тренера (Admin)
      if (state.currentView === 'admin') {
        const sortedSlots = [...state.data.slots].sort((a,b) => (a.date || '') > (b.date || '') ? 1 : -1);

        main.innerHTML = `
          <div class="space-y-4">
            <div class="flex justify-between items-center pb-2 border-b border-slate-800">
              <div>
                <span class="text-[10px] font-extrabold text-red-500 uppercase tracking-wider">Панель тренера</span>
                <h2 class="text-base font-black text-white">Управление графиком и пловцами</h2>
              </div>
              <button onclick="logout()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-xl font-bold text-slate-300">Выйти</button>
            </div>

            <!-- Генератор окон 07:00 - 23:00 -->
            <div class="bg-blue-950/40 border border-blue-500/30 p-3 rounded-2xl text-xs space-y-2">
              <span class="font-bold text-blue-200 block">Открыть окна на день (07:00 - 23:00, Пн-Сб):</span>
              <div class="flex gap-2">
                <input id="adminBatchDate" type="date" class="p-2 border border-slate-700 rounded-xl bg-slate-900 text-white font-bold flex-1" />
                <button onclick="generateDaySlots()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-xl font-bold whitespace-nowrap shadow-md">
                  + 17 слотов
                </button>
              </div>
            </div>

            <!-- Добавить ученика -->
            <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl text-xs space-y-2">
              <span class="font-bold text-white block">Добавить ученика:</span>
              <div class="grid grid-cols-2 gap-2">
                <input id="newClientName" placeholder="ФИО ученика" class="p-2 border border-slate-700 rounded-xl bg-slate-950 text-white" />
                <input id="newClientCode" placeholder="Код входа (001)" class="p-2 border border-slate-700 rounded-xl bg-slate-950 text-white font-bold" />
              </div>
              <div class="flex gap-2">
                <input id="newClientBal" type="number" placeholder="Тренировок" value="8" class="w-1/2 p-2 border border-slate-700 rounded-xl bg-slate-950 text-white font-bold" />
                <button onclick="addClient()" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold py-2 shadow-sm">Добавить</button>
              </div>
            </div>

            <!-- Окна и привязка -->
            <div>
              <span class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400 mb-1 block">Окна и закрепление клиентов:</span>
              <div class="space-y-1.5 max-h-72 overflow-y-auto pr-1">
                ${sortedSlots.length === 0 ? '<p class="text-xs text-slate-500 bg-slate-900 p-2.5 rounded-xl border border-slate-800">Окон нет. Добавьте их выше.</p>' : ''}
                ${sortedSlots.map(s => `
                  <div class="bg-slate-900 border ${s.completed ? 'border-slate-800 opacity-60' : s.bookedBy ? 'border-red-500/50' : 'border-slate-800'} p-2.5 rounded-xl text-xs space-y-1.5">
                    <div class="flex justify-between items-center">
                      <div>
                        <span class="font-bold text-white">${s.date || s.day} | ${s.time}</span>${s.completed ? '<span class="ml-2 text-[10px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded font-bold">Проведено (списано)</span>' : ''}
                      </div>
                      <button onclick="deleteSlot(${s.id})" class="text-red-400 hover:text-red-600"><i class="fa-regular fa-trash-can"></i></button>
                    </div>

                    <div class="flex items-center gap-2">
                      <span class="text-[10px] text-slate-400">Пловец:</span>
                      <select onchange="assignClientToSlot(${s.id}, this.value)" class="p-1.5 border border-slate-700 rounded-lg bg-slate-950 text-white flex-1 font-semibold text-xs">
                        <option value="">-- Свободное окно --</option>
                        ${state.data.clients.map(c => `
                          <option value="${c.id}" ${s.bookedBy === c.id ? 'selected' : ''}>${c.name} (${c.id}) [Баланс: ${c.balance}]</option>
                        `).join('')}
                      </select>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Список учеников и наплавленный километраж -->
            <div>
              <span class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400 mb-1 block">Ученики и километраж:</span>
              <div class="space-y-1.5 max-h-44 overflow-y-auto pr-1">
                ${state.data.clients.map(c => `
                  <div class="flex justify-between items-center bg-slate-900 border border-slate-800 p-2 rounded-xl text-xs">
                    <div>
                      <p class="font-bold text-white">${c.name} <span class="text-slate-400">(${c.id})</span></p>
                      <p class="text-blue-400 font-semibold">${c.balance} зан. | <span class="text-red-400 font-bold">${((c.meters || 0)/1000).toFixed(1)} км</span></p>
                    </div>
                    <div class="flex items-center gap-1">
                      <button onclick="addCoachMeters('${c.id}')" class="px-2 py-1 bg-red-950 border border-red-500/40 text-red-300 font-bold rounded-lg text-[10px]" title="Добавить метры">+Метры</button>
                      <button onclick="updateBalance('${c.id}', 1)" class="w-6 h-6 bg-slate-800 text-white font-bold rounded">+</button>
                      <button onclick="updateBalance('${c.id}', -1)" class="w-6 h-6 bg-slate-800 text-white font-bold rounded">-</button>
                      <button onclick="deleteClient('${c.id}')" class="w-6 h-6 bg-red-950 text-red-400 rounded"><i class="fa-regular fa-trash-can text-[10px]"></i></button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

          </div>
        `;
        return;
      }

      // 4. Магазин экипировки
      if (state.currentTab === 'shop') {
        main.innerHTML = `
          <div class="space-y-3">
            <div class="flex justify-between items-center">
              <div>
                <h2 class="text-sm font-black text-white">Магазин экипировки</h2>
                <p class="text-[11px] text-slate-400">Рекомендовано тренером</p>
              </div>
              <a href="https://vk.ru/club239758541" target="_blank" class="text-xs text-red-500 font-bold hover:underline">
                Каталог VK <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
              </a>
            </div>

            <div class="space-y-2.5 max-h-[500px] overflow-y-auto pr-1">
              ${state.data.products.map(p => `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 flex gap-3 items-center">
                  <img src="${p.image}" class="w-16 h-16 rounded-xl object-cover bg-slate-950 flex-shrink-0 border border-slate-800">
                  <div class="flex-1 min-w-0">
                    <span class="text-[9px] bg-red-950 text-red-400 px-1.5 py-0.5 rounded font-extrabold uppercase">${p.category || 'Плавание'}</span>
                    <h3 class="font-bold text-white text-xs truncate mt-0.5">${p.title}</h3>
                    <p class="text-[11px] text-slate-400 line-clamp-1">${p.desc}</p>
                    <div class="flex justify-between items-center mt-1.5">
                      <span class="font-black text-red-500 text-sm">${p.price} ₽</span>
                      <a href="https://t.me/${TG_USERNAME}?text=${encodeURIComponent('Кирилл, хочу заказать экипировку: ' + p.title)}" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-white text-[11px] font-bold px-3 py-1 rounded-lg transition">
                        Заказать
                      </a>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
    }

    function addCoachMeters(clientId) {
      const client = state.data.clients.find(c => c.id === clientId);
      if (!client) return;
      const meters = prompt(`Сколько метров проплыл ${client.name} на тренировке? (например: 1500):`);
      if (meters && parseInt(meters) > 0) {
        client.meters = (client.meters || 0) + parseInt(meters);
        saveToServer();
        render();
        alert(`${meters} м успешно зачислено!`);
      }
    }

    function loginClient() {
      const code = document.getElementById('clientCodeInput').value.trim();
      const client = state.data.clients.find(c => c.id === code);
      if (client) {
        state.currentClientId = client.id;
        state.currentView = 'client_cabinet';
        render();
      } else {
        alert("Ученик с таким кодом не найден. Проверьте код или напишите тренеру.");
      }
    }

    function toggleAdminAuth() {
      if (state.currentView === 'admin') {
        state.currentView = 'client_login';
        render();
        return;
      }
      const pin = prompt("Введите PIN-код тренера:");
      if (pin === ADMIN_PIN) {
        state.currentView = 'admin';
        render();
      } else if (pin !== null) {
        alert("Неверный PIN-код!");
      }
    }

    function logout() {
      state.currentClientId = null;
      state.currentView = 'client_login';
      state.currentTab = 'booking';
      render();
    }

    function addClient() {
      const name = document.getElementById('newClientName').value.trim();
      const code = document.getElementById('newClientCode').value.trim();
      const bal = parseInt(document.getElementById('newClientBal').value) || 0;
      if (!name || !code) return alert("Заполните имя и код!");

      state.data.clients.push({ id: code, name: name, balance: bal, meters: 0 });
      saveToServer();
      render();
    }

    function deleteClient(clientId) {
      if (!confirm("Удалить ученика?")) return;
      state.data.slots.forEach(s => { if (s.bookedBy === clientId) s.bookedBy = null; });
      state.data.clients = state.data.clients.filter(c => c.id !== clientId);
      saveToServer();
      render();
    }

    function updateBalance(clientId, delta) {
      const client = state.data.clients.find(c => c.id === clientId);
      if (client) {
        client.balance = Math.max(0, client.balance + delta);
        saveToServer();
        render();
      }
    }

    function deleteSlot(slotId) {
      if (!confirm("Удалить это окно?")) return;
      state.data.slots = state.data.slots.filter(s => s.id !== slotId);
      saveToServer();
      render();
    }
  </script>
</body>
</html>
