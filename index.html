    // Сжатие фото из галереи устройства
    function compressImage(file, maxWidth, maxHeight, quality, callback) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          let width = img.width;
          let height = img.height;
          if (width > height) {
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
          } else {
            if (height > maxHeight) {
              width = Math.round((width * maxHeight) / height);
              height = maxHeight;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

          preview.classList.remove('hidden');

            </div>

            <div class="space-y-3 max-h-[500px] overflow-y-auto pr-1">
              ${filteredProducts.length === 0 ? '<p class="text-xs text-slate-400 text-center py-6">В этом разделе пока нет товаров.</p>' : ''}
              ${filteredProducts.map(p => {
                const activeColor = state.selectedColors[p.id] || (p.colors && p.colors.length ? p.colors[0] : null);
                return `
                  <div onclick="openProductModal(${p.id})" class="bg-white border border-slate-200 rounded-2xl p-3 flex flex-col gap-2 shadow-sm hover:border-blue-300 transition cursor-pointer">
                    <div class="flex gap-3 items-center">
                      <div class="w-20 h-20 bg-slate-50 rounded-xl flex items-center justify-center p-1.5 flex-shrink-0 border border-slate-100 overflow-hidden">
                        <img src="${p.image}" alt="${p.title}" class="h-full w-full object-cover rounded-lg" onerror="this.src='https://placehold.co/100x100?text=Товар'">
                      </div>
                      <div class="flex flex-col justify-between flex-1 min-w-0">
                        <div>
                          <span class="text-[9px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded font-bold">${p.category || 'Плавание'}</span>
                          <h3 class="font-bold text-slate-800 text-xs leading-snug truncate mt-0.5">${p.title}</h3>
                          <p class="text-[11px] text-slate-500 line-clamp-2 mt-0.5">${p.desc}</p>
                        </div>
                        <div class="flex justify-between items-center mt-1">
                          <span class="font-black text-blue-600 text-sm">${p.price} ₽</span>
                          <span class="text-[10px] text-blue-500 font-semibold">Подробнее →</span>
                        </div>
                      </div>
                    </div>

                    ${p.colors && p.colors.length ? `
                      <div class="pt-2 border-t border-slate-100 flex flex-wrap gap-1.5 items-center" onclick="event.stopPropagation()">
                        <span class="text-[10px] text-slate-400 font-medium mr-1">Цвет:</span>
                        ${p.colors.map(col => `
                          <button onclick="selectColor(${p.id}, '${col}', event)" class="px-2 py-0.5 rounded-lg text-[10px] font-semibold border transition ${activeColor === col ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'}">
                            ${col}
                          </button>
                        `).join('')}
                      </div>
                    ` : ''}

                    <button onclick="event.stopPropagation(); orderProduct(${p.id})" class="w-full bg-slate-900 hover:bg-blue-600 text-white text-xs font-bold py-2 rounded-xl shadow-sm transition flex items-center justify-center gap-1.5 mt-0.5">
                      <i class="fa-brands fa-telegram text-sm"></i> Заказать в Telegram (${p.price} ₽)
                    </button>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
        return;
      }

      // 3. Кабинет ученика
      if (state.currentView === 'client_cabinet' && state.currentTab === 'booking') {
        const client = state.data.clients.find(c => c.id === state.currentClientId);
        const mySlots = state.data.slots.filter(s => s.bookedBy === client.id);
        const freeSlots = state.data.slots.filter(s => !s.bookedBy);

        main.innerHTML = `
          <div class="space-y-4">
            <div class="flex justify-between items-center bg-slate-50 p-3.5 rounded-2xl border border-slate-100">
              <div class="flex items-center gap-3">
                <label class="relative cursor-pointer group" title="Загрузить фото из фотоплёнки">
                  <img src="${client.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80'}" class="w-14 h-14 rounded-full object-cover border-2 border-blue-500 shadow-sm" onerror="this.src='https://placehold.co/100x100?text=Фото'">
                  <span class="absolute bottom-0 right-0 bg-blue-600 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center border-2 border-white shadow">
                    <i class="fa-solid fa-camera"></i>
                  </span>
                  <input type="file" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)">
                </label>
                <div>
                  <h2 class="text-sm font-bold text-slate-800 leading-tight">${client.name}</h2>
                  <label class="text-[11px] text-blue-600 font-semibold hover:underline cursor-pointer inline-flex items-center gap-1 mt-1">
                    <i class="fa-regular fa-image"></i> Фото из фотоплёнки
                    <input type="file" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)">
                  </label>
                </div>
              </div>
              <button onclick="logout()" class="text-xs text-slate-400 hover:text-red-500 font-medium">
                Выйти <i class="fa-solid fa-arrow-right-from-bracket ml-0.5"></i>
              </button>
            </div>

            <div class="bg-blue-50 border border-blue-100 rounded-2xl p-3.5 flex items-center justify-between">
              <div>
                <span class="text-[10px] font-bold text-blue-600 uppercase tracking-wider">Остаток тренировок</span>
                <p class="text-2xl font-black text-blue-900 mt-0.5">${client.balance} <span class="text-xs font-medium">зан.</span></p>
              </div>
              <a href="https://t.me/${TG_USERNAME}?text=${encodeURIComponent('Кирилл, добрый день! Хочу продлить абонемент на тренировки.')}" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3.5 py-2 rounded-xl font-bold shadow-sm transition">
                Продлить
              </a>
            </div>

            <div>
              <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Ваши активные записи</h3>
              ${mySlots.length === 0 ? '<p class="text-xs text-slate-400 bg-slate-50 p-2.5 rounded-xl border border-slate-100">Пока нет записей. Выберите свободное время ниже.</p>' : ''}
              <div class="space-y-1.5">
                ${mySlots.map(s => `
                  <div class="flex justify-between items-center bg-emerald-50 border border-emerald-100 p-2.5 rounded-xl text-xs">
                    <span class="font-bold text-emerald-800"><i class="fa-regular fa-clock mr-1"></i> ${s.day} в ${s.time}</span>
                    <button onclick="cancelSlot(${s.id})" class="text-red-500 font-semibold hover:underline">Отменить</button>
                  </div>
                `).join('')}
              </div>
            </div>

            <div>
              <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Свободные окна тренера</h3>
              <div class="space-y-1.5 max-h-48 overflow-y-auto pr-1">
                ${freeSlots.length === 0 ? '<p class="text-xs text-slate-400">Свободных окон пока нет.</p>' : ''}
                ${freeSlots.map(s => `
                  <div class="flex justify-between items-center bg-slate-50 border border-slate-100 p-2.5 rounded-xl text-xs hover:border-blue-200 transition">
                    <span class="font-medium text-slate-700">${s.day},${s.time}</span>
                    <button onclick="bookSlot(${s.id})" class="bg-blue-600 text-white px-3 py-1 rounded-lg font-bold hover:bg-blue-700 transition">Записаться</button>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
        return;
      }

      // 4. Панель тренера (Admin)
      if (state.currentView === 'admin') {
        const categories = state.data.categories || defaultCategories;

        main.innerHTML = `
          <div class="space-y-4">
            <div class="flex justify-between items-center pb-2 border-b border-slate-100">
              <div>
                <span class="text-[10px] font-bold text-blue-600 uppercase">Режим тренера</span>
                <h2 class="text-base font-black text-slate-800">Панель управления</h2>
              </div>
              <button onclick="logout()" class="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-xl font-bold">Выйти</button>
            </div>

            <!-- Добавить ученика -->
            <div class="bg-slate-50 border border-slate-200 p-3 rounded-2xl text-xs space-y-2">
              <span class="font-bold text-slate-700 block">Добавить нового ученика:</span>
              <div class="grid grid-cols-2 gap-2">
                <input id="newClientName" placeholder="ФИО ученика" class="p-2 border rounded-xl bg-white" />
                <input id="newClientCode" placeholder="Код входа (напр. 001)" class="p-2 border rounded-xl bg-white" />
              </div>
              <div class="flex gap-2">
                <input id="newClientBal" type="number" placeholder="Тренировок" value="8" class="w-1/2 p-2 border rounded-xl bg-white" />
                <button onclick="addClient()" class="w-1/2 bg-blue-600 text-white rounded-xl font-bold py-2 shadow-sm">Добавить</button>
              </div>
            </div>

            <!-- Список учеников -->
            <div>
              <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1 block">Ученики (${state.data.clients.length} чел):</span>
              <div class="space-y-1.5 max-h-40 overflow-y-auto pr-1">
                ${state.data.clients.length === 0 ? '<p class="text-xs text-slate-400 bg-slate-50 p-2 rounded-xl">Учеников пока нет.</p>' : ''}
                ${state.data.clients.map(c => `
                  <div class="flex justify-between items-center bg-white border border-slate-200 p-2 rounded-xl text-xs">
                    <div class="truncate pr-1">
                      <p class="font-bold text-slate-800 truncate">${c.name} <span class="text-[10px] text-slate-400">(${c.id})</span></p>
                      <p class="text-blue-600 font-semibold">${c.balance} зан.</p>
                    </div>
                    <div class="flex items-center gap-1 flex-shrink-0">
                      <button onclick="updateBalance('${c.id}', 1)" class="w-6 h-6 bg-slate-100 rounded-md font-bold">+</button>
                      <button onclick="updateBalance('${c.id}', -1)" class="w-6 h-6 bg-slate-100 rounded-md font-bold">-</button>
                      <button onclick="deleteClient('${c.id}')" class="w-6 h-6 bg-red-50 text-red-500 rounded-md"><i class="fa-regular fa-trash-can text-[10px]"></i></button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Окно графика -->
            <div class="bg-slate-50 border border-slate-200 p-3 rounded-2xl text-xs space-y-2">
              <span class="font-bold text-slate-700 block">Добавить окно в график:</span>
              <div class="flex gap-2">
                <select id="newSlotDay" class="p-2 border rounded-xl bg-white flex-1">
                  <option>Понедельник</option><option>Вторник</option><option>Среда</option><option>Четверг</option><option>Пятница</option><option>Суббота</option><option>Воскресенье</option>
                </select>
                <input id="newSlotTime" placeholder="10:00" class="w-20 p-2 border rounded-xl bg-white text-center" />
                <button onclick="addSlot()" class="bg-slate-800 text-white px-3 rounded-xl font-bold">ОК</button>
              </div>
            </div>

            <!-- Список окон -->
            <div>
              <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1 block">Все окна расписания:</span>
              <div class="space-y-1 max-h-28 overflow-y-auto pr-1">
                ${state.data.slots.map(s => `
                  <div class="flex justify-between items-center bg-white border border-slate-200 px-2.5 py-1.5 rounded-xl text-xs">
                    <span>${s.day} ${s.time}${s.bookedBy ? '<b class="text-blue-600">(Занято)</b>' : ''}</span>
                    <button onclick="deleteSlot(${s.id})" class="text-red-400 hover:text-red-600"><i class="fa-regular fa-trash-can text-xs"></i></button>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Категории -->
            <div class="bg-slate-50 border border-slate-200 p-3 rounded-2xl text-xs space-y-2">
              <span class="font-bold text-slate-700 block">Разделы (категории) магазина:</span>
              <div class="flex gap-2">
                <input id="newCategoryInput" placeholder="Новый раздел (напр. Ласты)" class="p-2 border rounded-xl bg-white flex-1" />
                <button onclick="addCategory()" class="bg-blue-600 text-white px-3 rounded-xl font-bold">Добавить</button>
              </div>
              <div class="flex flex-wrap gap-1 pt-1">
                ${categories.map(cat => `
                  <span class="bg-white border border-slate-200 px-2 py-0.5 rounded-lg text-[10px] font-semibold flex items-center gap-1">
                    ${cat}
                    <button onclick="deleteCategory('${cat}')" class="text-red-400 hover:text-red-600">×</button>
                  </span>
                `).join('')}
              </div>
            </div>

            <!-- Добавить товар -->
            <div class="bg-blue-50/70 border border-blue-200 p-3.5 rounded-2xl text-xs space-y-2.5">
              <span class="font-bold text-blue-900 block text-sm">Добавить новый товар:</span>
              <div class="grid grid-cols-2 gap-2">
                <input id="newProdTitle" placeholder="Название товара" class="p-2.5 border rounded-xl bg-white" />
                <select id="newProdCategory" class="p-2.5 border rounded-xl bg-white font-medium">
                  ${categories.map(c => `<option value="${c}">${c}</option>`).join('')}
                </select>
              </div>
              <div class="grid grid-cols-2 gap-2">
                <input id="newProdPrice" type="number" placeholder="Цена (₽)" class="p-2.5 border rounded-xl bg-white font-bold" />
                <input id="newProdColors" placeholder="Цвета (черный, синий...)" class="p-2.5 border rounded-xl bg-white" />
              </div>
              
              <div class="bg-white p-2.5 rounded-xl border border-blue-200 flex items-center gap-3">
                <img id="newProdPreview" class="hidden w-12 h-12 object-cover rounded-lg border border-slate-200" />
                <div class="flex-1">
                  <label class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-3 rounded-xl cursor-pointer inline-flex items-center gap-1.5 text-xs shadow-sm transition">
                    <i class="fa-solid fa-camera"></i> Загрузить фото из фотоплёнки
                    <input type="file" accept="image/*" class="hidden" onchange="handleNewProductPhoto(event)" />
                  </label>
                  <span id="newProdPhotoStatus" class="block text-[10px] text-emerald-600 font-semibold mt-1"></span>
                </div>
              </div>

              <textarea id="newProdDesc" placeholder="Подробное описание товара" class="w-full p-2.5 border rounded-xl bg-white h-14"></textarea>
              <button onclick="addProduct()" class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold py-2.5 shadow-sm text-sm transition">
                Добавить товар в каталог
              </button>
            </div>

            <!-- Список товаров -->
            <div>
              <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1 block">Все товары (${state.data.products.length} шт):</span>
              <div class="space-y-1.5 max-h-48 overflow-y-auto pr-1">
                ${state.data.products.map(p => `
                  <div class="flex justify-between items-center bg-white border border-slate-200 p-2 rounded-xl text-xs">
                    <div class="flex items-center gap-2 truncate pr-2">
                      <img src="${p.image}" class="w-9 h-9 rounded-lg object-cover bg-slate-50 flex-shrink-0" onerror="this.src='https://placehold.co/50x50?text=Товар'">
                      <div class="truncate">
                        <span class="text-[9px] bg-slate-100 text-slate-500 px-1 py-0.5 rounded font-bold">${p.category || 'Плавание'}</span>
                        <p class="font-semibold text-slate-800 truncate">${p.title} (${p.price} ₽)</p>
                      </div>
                    </div>
                    <div class="flex gap-1 flex-shrink-0">
                      <button onclick="openEditProductModal(${p.id})" class="w-7 h-7 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-lg flex items-center justify-center" title="Редактировать товар">
                        <i class="fa-solid fa-pen text-[10px]"></i>
                      </button>
                      <button onclick="deleteProduct(${p.id})" class="w-7 h-7 bg-red-50 text-red-500 hover:bg-red-100 rounded-lg flex items-center justify-center" title="Удалить товар">
                        <i class="fa-regular fa-trash-can text-[10px]"></i>
                      </button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

          </div>
        `;
      }
    }

    // Логика приложения
    function loginClient() {
      const code = document.getElementById('clientCodeInput').value.trim();
      const client = state.data.clients.find(c => c.id === code || c.phone === code);
      if (client) {
        state.currentClientId = client.id;
        state.currentView = 'client_cabinet';
        render();
      } else {
        alert("Ученик с таким кодом не найден. Проверьте номер или напишите Кириллу.");
      }
    }

    function toggleAdminAuth() {
      if (state.currentView === 'admin') {
        state.currentView = 'client_login';
        render();
        return;
      }
      const pin = prompt("Введите PIN-код тренера:");
      if (pin === ADMIN_PIN) {
        state.currentView = 'admin';
        render();
      } else if (pin !== null) {
        alert("Неверный PIN-код!");
      }
    }

    function logout() {
      state.currentClientId = null;
      state.currentView = 'client_login';
      state.currentTab = 'booking';
      render();
    }

    function bookSlot(slotId) {
      const client = state.data.clients.find(c => c.id === state.currentClientId);
      if (client.balance <= 0) {
        alert("У вас закончились тренировки. Напишите Кириллу в Telegram для продления абонемента!");
        return;
      }
      const slot = state.data.slots.find(s => s.id === slotId);
      slot.bookedBy = client.id;
      client.balance -= 1;
      saveToServer();
      render();
    }

    function cancelSlot(slotId) {
      const client = state.data.clients.find(c => c.id === state.currentClientId);
      const slot = state.data.slots.find(s => s.id === slotId);
      slot.bookedBy = null;
      client.balance += 1;
      saveToServer();
      render();
    }

    function addClient() {
      const name = document.getElementById('newClientName').value.trim();
      const code = document.getElementById('newClientCode').value.trim();
      const bal = parseInt(document.getElementById('newClientBal').value) || 0;
      if (!name || !code) return alert("Заполните имя и код");

      state.data.clients.push({ id: code, name: name, phone: code, balance: bal, avatar: "" });
      saveToServer();
      render();
    }

    function deleteClient(clientId) {
      if (!confirm("Удалить ученика?")) return;
      state.data.slots.forEach(s => { if (s.bookedBy === clientId) s.bookedBy = null; });
      state.data.clients = state.data.clients.filter(c => c.id !== clientId);
      saveToServer();
      render();
    }

    function updateBalance(clientId, delta) {
      const client = state.data.clients.find(c => c.id === clientId);
      if (client) {
        client.balance = Math.max(0, client.balance + delta);
        saveToServer();
        render();
      }
    }

    function addSlot() {
      const day = document.getElementById('newSlotDay').value;
      const time = document.getElementById('newSlotTime').value.trim();
      if (!time) return alert("Введите время");

      state.data.slots.push({ id: Date.now(), day: day, time: time, bookedBy: null });
      saveToServer();
      render();
    }

    function deleteSlot(slotId) {
      if (!confirm("Удалить окно?")) return;
      state.data.slots = state.data.slots.filter(s => s.id !== slotId);
      saveToServer();
      render();
    }

    function addCategory() {
      const name = document.getElementById('newCategoryInput').value.trim();
      if (!name) return;
      state.data.categories = state.data.categories || defaultCategories;
      if (!state.data.categories.includes(name)) {
        state.data.categories.push(name);
        saveToServer();
        render();
      }
    }

    function deleteCategory(cat) {
      if (!confirm(`Удалить раздел "${cat}"?`)) return;
      state.data.categories = (state.data.categories || defaultCategories).filter(c => c !== cat);
      saveToServer();
      render();
    }

    function addProduct() {
      const title = document.getElementById('newProdTitle').value.trim();
      const cat = document.getElementById('newProdCategory').value;
      const price = parseInt(document.getElementById('newProdPrice').value) || 0;
      const img = state.tempNewProdImage || 'https://images.unsplash.com/photo-1519315901367-f34ff9154487?auto=format&fit=crop&w=400&q=80';
      const colorsVal = document.getElementById('newProdColors').value.trim();
      const desc = document.getElementById('newProdDesc').value.trim();

      if (!title || !price) return alert("Укажите название и цену товара!");

      state.data.products.unshift({
        id: Date.now(),
        category: cat,
        title: title,
        price: price,
        desc: desc || "Качественная экипировка для плавания.",
        image: img,
        colors: colorsVal ? colorsVal.split(',').map(c => c.trim()).filter(Boolean) : []
      });
      state.tempNewProdImage = '';
      saveToServer();
      render();
      alert("Товар добавлен!");
    }

    function deleteProduct(prodId) {
      if (!confirm("Удалить этот товар из витрины?")) return;
      state.data.products = state.data.products.filter(p => p.id !== prodId);
      saveToServer();
      render();
    }

    render();
  </script>
</body>
</html>
